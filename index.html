      <table>${allTags.map(t => `<tr><td><input type="text" value="${esc(t)}" data-rename="${esc(t)}" aria-label="Tag name"></td><td style="white-space:nowrap;color:var(--muted);font-size:13px">${usage.get(t) || 0} in use</td>
        <td style="white-space:nowrap"><button class="mini" data-renamebtn="${esc(t)}">Rename</button> <button class="mini danger" data-deltag="${esc(t)}">Delete</button></td></tr>`).join("")}</table>
      <form id="newtag" style="display:flex;gap:6px;margin-top:10px;max-width:420px"><input type="text" placeholder="New role tag" maxlength="40" aria-label="New role tag" style="flex:1;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)"><button class="mini">Add tag</button></form>
    </div></details>

    <details class="panel" id="syncpanel" ${params.get("sync") ? "open" : ""}><summary>Team sharing ${SYNC.cfg() ? "(on)" : "(off: this browser only)"}</summary><div>
      <p class="help">Without team sync, shortlists, bookmarks, tags and notes are stored only in this browser. To share them, the team keeps one JSON file
        in a GitHub repository (preferably a <strong>private</strong> one, because this site's repository is public). Each person enters a
        fine-grained personal access token with <em>Contents: read and write</em> on that repository. The token stays in this browser.</p>
      <form id="syncform"><div class="grid">
        <label for="s-repo">Repository</label><input type="text" id="s-repo" placeholder="owner/private-repo" value="${esc(cfg.repo || "")}" required>
        <label for="s-branch">Branch</label><input type="text" id="s-branch" value="${esc(cfg.branch || "main")}" required>
        <label for="s-path">File path</label><input type="text" id="s-path" value="${esc(cfg.path || "irl/saved.json")}" required>
        <label for="s-token">Access token</label><input type="password" id="s-token" placeholder="github_pat_…" value="${esc(cfg.token || "")}" required autocomplete="off">
        <label for="s-name">Your name</label><input type="text" id="s-name" placeholder="Shown as 'last changed by'" value="${esc(cfg.name || "")}">
      </div>
      <button class="btn" type="submit">${SYNC.cfg() ? "Save settings" : "Turn on team sync"}</button>
      ${SYNC.cfg() ? `<button class="btn subtle" type="button" id="syncnow">Sync now</button> <button class="btn subtle" type="button" id="syncoff">Turn off on this browser</button>` : ""}</form>
      <p class="help">Backups: <a href="#" id="exportjson">download everything as JSON</a> · <label style="color:var(--accent);cursor:pointer">import a JSON backup<input type="file" id="importjson" accept=".json,application/json" hidden></label> (merged with what is here).</p>

  document.querySelectorAll("[data-stab]").forEach(b => b.onclick = () => go("/saved", new URLSearchParams({ tab: b.dataset.stab === "docs" ? "docs" : "" })));

  const clr = document.getElementById("slclear");
  if (clr) clr.onclick = () => { if (confirm(`Remove every ${tab === "docs" ? "bookmark" : "shortlisted candidate"}${SYNC.cfg() ? " for the whole team" : ""}?`)) { STORE.clearKind(tab === "docs" ? "d" : "c"); route(); } };
  document.querySelectorAll("[data-renamebtn]").forEach(b => b.onclick = () => {
    const from = b.dataset.renamebtn, to = document.querySelector(`[data-rename="${CSS.escape(from)}"]`).value;
    STORE.renameTag(from, to); go("/saved", new URLSearchParams({ tab: tab === "docs" ? "docs" : "", manage: "1" })); route();
  });
  document.querySelectorAll("[data-deltag]").forEach(b => b.onclick = () => {
    const t = b.dataset.deltag, n = usage.get(t) || 0;
    if (!n || confirm(`Delete the role tag "${t}"? It will be removed from ${n} item${n === 1 ? "" : "s"}.`)) { STORE.deleteTag(t); route(); }
  });
  document.getElementById("newtag").onsubmit = e => { e.preventDefault(); STORE.addTag(e.target.querySelector("input").value); route(); };
  document.getElementById("syncform").onsubmit = e => {
    e.preventDefault();
    const v = id => document.getElementById(id).value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(v("s-repo"))) { alert("Repository must look like owner/name"); return; }
    SYNC.configure({ repo: v("s-repo"), branch: v("s-branch") || "main", path: v("s-path").replace(/^\/+/, ""), token: v("s-token"), name: v("s-name") });
    route();
  };
  const now = document.getElementById("syncnow"); if (now) now.onclick = () => SYNC.sync();
  const off = document.getElementById("syncoff"); if (off) off.onclick = () => { if (confirm("Stop syncing on this browser? Your saved items stay here; the team file is not changed.")) { SYNC.configure(null); route(); } };
  document.getElementById("exportjson").onclick = e => { e.preventDefault(); download(JSON.stringify(STORE.snapshot(), null, 1), "application/json", `infinity-saved-${today()}.json`); };
  document.getElementById("importjson").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const n = STORE.merge(JSON.parse(await f.text())).length; alert(`Imported: ${n} item${n === 1 ? "" : "s"} updated.`); SYNC.schedule(); route(); }
    catch (err) { alert("That file is not a valid backup: " + err.message); }
  };
}

const today = () => new Date().toISOString().slice(0, 10);
const libLink = hash => location.href.split("#")[0] + hash;
function toCsv(cols, rows) {
  const cell = v => { const t = String(v ?? ""); return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  return "﻿" + [cols, ...rows].map(r => r.map(cell).join(",")).join("\r\n");   // BOM so Excel reads UTF-8 names
}
function download(text, type, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function downloadCandsCsv(list, bmByCand) {
  const cols = ["Name", "Role tags", "Fit for Infinity", "Track", "Fit reason (research team)", "Source", "Source group", "University", "Company / organisation",
    "Role / institution", "Blog / site", "GitHub", "X", "Relevance", "Research note", "Archived documents", "Source URLs", "Bookmarked results", "Notes", "Last changed by", "Library link"];
  const rows = list.map(it => {
    const c = S.cands.get(it.id), docs = c.docs.map(x => S.byId.get(x)).filter(Boolean);
    return [c.name, it.tags.join("; "), c.fit || "Not rated", c.track, c.fitReason, srcLabel(c.source), c.group, c.university, c.company, c.institution, c.site, c.github, c.x,
      c.relevance, c.note, docs.filter(d => !isExternal(d)).length, [...new Set(docs.map(d => d.url).filter(Boolean))].join(" "),
      (bmByCand.get(c.id) || []).map(d => d.title).join("; "), it.note, it.by, libLink("#/candidate/" + encodeURIComponent(c.id))];
  });
  download(toCsv(cols, rows), "text/csv;charset=utf-8", `infinity-shortlist-${today()}.csv`);
}
function downloadDocsCsv(list) {
  const cols = ["Title", "Role tags", "Candidate", "Candidate role tags", "Fit for Infinity", "Source", "Source group", "University", "Company / organisation",
    "Content type", "Availability", "Published", "Original URL", "Notes", "Last changed by", "Library link"];
  const rows = list.map(it => {
    const d = S.byId.get(it.id), c = S.cands.get(d.candidate);
    return [d.title, it.tags.join("; "), d.name, STORE.tagsOf(STORE.key("c", c.id)).join("; "), c.fit || "Not rated", srcLabel(d.source), d.group, d.university, c.company,
      d.type, d.availability, d.date, d.url, it.note, it.by, libLink("#/doc/" + encodeURIComponent(d.id))];
  });
  download(toCsv(cols, rows), "text/csv;charset=utf-8", `infinity-bookmarks-${today()}.csv`);
}

// ------------------------------------------------------------------ browse page
function renderBrowse(params) {
  const mode = ["group", "source"].includes(params.get("by")) ? params.get("by") : "university";
  const filter = (params.get("f") || "").toLowerCase();
  const keyOf = c => mode === "group" ? c.group : mode === "source" ? srcLabel(c.source) : (c.university || "University not listed");
  const buckets = new Map();
  for (const c of S.index.candidates) {
    const hay = (c.name + " " + c.university + " " + c.institution + " " + c.group + " " + (c.company || "")).toLowerCase();
    if (filter && !hay.includes(filter)) continue;
    const k = keyOf(c);
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(c);
  }
  const keys = [...buckets.keys()].sort((a, b) => (a === "University not listed") - (b === "University not listed") || a.localeCompare(b));
  const open = filter || keys.length <= 3;
  $app.innerHTML = `<div class="page">
    <div class="browse-head">
      <div class="seg"><button data-by="university" class="${mode === "university" ? "on" : ""}">By university</button><button data-by="source" class="${mode === "source" ? "on" : ""}">By source</button><button data-by="group" class="${mode === "group" ? "on" : ""}">By source group</button></div>
      <input type="search" id="bf" placeholder="Filter candidates by name, university, company or role…" value="${esc(params.get("f") || "")}">
    </div>
    ${keys.length ? keys.map(k => {
      const cs = buckets.get(k).sort((a, b) => a.name.localeCompare(b.name));
      const nd = cs.reduce((n, c) => n + c.docs.length, 0);
      return `<details class="group" ${open ? "open" : ""}><summary>${esc(k)} <span>${cs.length} candidate${cs.length === 1 ? "" : "s"} · ${nd} documents</span></summary>
        <ul class="cand-list">${cs.map(c => `<li><a class="pname" href="#/candidate/${encodeURIComponent(c.id)}">${esc(c.name)}</a> <small>${c.fit ? esc(c.fit) + " fit · " : ""}${c.docs.length} doc${c.docs.length === 1 ? "" : "s"}${mode !== "university" && c.university ? " · " + esc(c.university) : ""}${mode !== "group" ? " · " + esc(c.group) : ""}</small></li>`).join("")}</ul></details>`;
    }).join("") : `<div class="empty">No candidates match.</div>`}
  </div>`;
  if (!document.activeElement || document.activeElement.id !== "bf") scrollTo(0, 0);
  document.querySelectorAll("[data-by]").forEach(b => b.onclick = () => go("/browse", new URLSearchParams({ by: b.dataset.by === "university" ? "" : b.dataset.by, f: params.get("f") || "" })));
  const bf = document.getElementById("bf");
  let timer;
  bf.oninput = () => { clearTimeout(timer); timer = setTimeout(() => {
    history.replaceState(null, "", "#/browse?" + new URLSearchParams([["by", mode === "university" ? "" : mode], ["f", bf.value]].filter(([, v]) => v)));
    renderBrowse(new URLSearchParams(location.hash.split("?")[1] || "")); const n = document.getElementById("bf"); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
  }, 150); };
}

start(false);
</script>
