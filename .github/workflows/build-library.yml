# Builds the private research library from the Google Drive archive and deploys it to GitHub Pages.
#   1. tools/drive_sync.py   crawls the Drive archive (read-only) and downloads new/changed papers into a cache
#   2. tools/build_index.py  builds the encrypted full-text and meaning index + metadata (no full texts are published)
#   3. the site is deployed to GitHub Pages
# Runs every 6 hours, on demand (Actions tab > "Build library" > Run workflow), and when the site code changes.
# Google access: Workload Identity Federation (keyless). The automatic runs stay off until the repository variable
# LIBRARY_BUILD_ENABLED is "true", which you set after the "Verify Drive access" workflow passes.
# Setup: README.md > Deployment.
name: Build library

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "config.json", "tools/**", "vendor/**", "eval/**", "data/blogs.enc", ".github/workflows/build-library.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: library-pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.LIBRARY_BUILD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.sync.outputs.complete }}
    env:
      PYTHONUNBUFFERED: "1"        # show progress lines immediately in the Actions log
      CACHE_DIR: .cache/drive
      # stop downloading after 4.5 hours so the cache is always saved; the next run continues
      DRIVE_SYNC_BUDGET_MINUTES: "270"
      DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID || '1TbckZTHb2sbKMZDyskcgt0uczTfimXnI' }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud (Workload Identity Federation, no keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          pip install -q requests google-auth numpy scipy scikit-learn cryptography onnxruntime tokenizers
      - name: Restore the Drive text cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/drive
          key: drive-cache-${{ github.run_id }}
          restore-keys: drive-cache-
      - name: Sync from Google Drive (new and changed papers only)
        id: sync
        run: python3 tools/drive_sync.py
      - name: Save the Drive text cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/drive
          key: drive-cache-${{ github.run_id }}
      - name: Archive not fully downloaded yet
        if: steps.sync.outputs.complete != 'true'
        run: |
          echo "::notice::The Drive archive is still being downloaded (progress saved). The website keeps its current index; the next run continues. $(cat .cache/drive/sync_status.json)"
      # the meaning model (downloaded once from Hugging Face, fingerprint-checked; see tools/models.py) and the document
      # vectors are kept between runs, so only new or changed papers are processed by the model
      - name: Restore the meaning model and document vectors
        if: steps.sync.outputs.complete == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/models
            .cache/embeddings
          key: meaning-${{ github.run_id }}
          restore-keys: meaning-
      - name: Build the encrypted index
        if: steps.sync.outputs.complete == 'true'
        timeout-minutes: 150
        run: python3 tools/build_index.py --out site
      - name: Save the meaning model and document vectors
        if: always() && steps.sync.outputs.complete == 'true' && hashFiles('.cache/embeddings/keys.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/models
            .cache/embeddings
          key: meaning-${{ github.run_id }}
      # search quality and library health: runs the site's own search on the real library and adds an encrypted report
      # ("Search quality" page). Only headline numbers go to the run summary. A failure here never stops publishing.
      - name: Restore search-quality history
        if: steps.sync.outputs.complete == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/eval-history.json
          key: eval-history-${{ github.run_id }}
          restore-keys: eval-history-
      - name: Measure search quality and library health
        id: evalq
        if: steps.sync.outputs.complete == 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          mkdir -p "$RUNNER_TEMP/evaltools" && cd "$RUNNER_TEMP/evaltools"
          npm init -y >/dev/null && npm install --no-audit --no-fund --silent playwright@1.49.1
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          NODE_PATH="$RUNNER_TEMP/evaltools/node_modules" node tools/search_eval.js --site site --keyfile "$CACHE_DIR/keyfile.bin" \
            --topics eval/topics.json --out "$RUNNER_TEMP/eval-report.json" --minutes 35
          python3 tools/publish_eval.py --report "$RUNNER_TEMP/eval-report.json" --site site --cache "$CACHE_DIR" --history .cache/eval-history.json
      - name: Save search-quality history
        if: steps.evalq.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/eval-history.json
          key: eval-history-${{ github.run_id }}
      - uses: actions/configure-pages@v5
        if: steps.sync.outputs.complete == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.sync.outputs.complete == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.complete == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
